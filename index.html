<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Whisky Safe</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d0e12;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding-bottom: 40px;
        }
        header {
            background-color: #161922;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 1px solid #1f2937;
        }
        h1 { color: #f59e0b; font-size: 24px; letter-spacing: 1px; }
        p.subtitle { color: #9ca3af; font-size: 12px; margin-top: 5px; }
        main { max-width: 450px; margin: 0 auto; padding: 15px; }
        
        .card {
            background-color: #161922;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .grid { display: grid; grid-template-cols: 1fr 1fr; gap: 10px; }
        .stat-label { color: #9ca3af; font-size: 11px; text-transform: uppercase; }
        .stat-val { font-size: 18px; font-weight: bold; margin-top: 5px; }
        
        .btn {
            width: 100%;
            background-color: #f59e0b;
            color: #0d0e12;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        .btn-scan { background-color: #3f3f46; color: white; text-align: center; line-height: 1.5; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; color: #9ca3af; font-size: 11px; margin-bottom: 4px; }
        input {
            width: 100%;
            background-color: #1e2330;
            border: 1px solid #374151;
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
        }
        
        .whisky-item {
            background-color: #161922;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-name { font-weight: bold; font-size: 14px; color: #f3f4f6; }
        .item-meta { color: #9ca3af; font-size: 12px; margin-top: 2px; }
        .item-val { color: #f59e0b; font-weight: bold; font-size: 14px; text-align: right; }
        .btn-delete { background: none; color: #6b7280; border: none; font-size: 16px; cursor: pointer; padding: 5px; }

        /* Custom Popup Style */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background-color: #161922;
            border: 1px solid #374151;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            max-width: 300px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-title { color: #4ade80; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>WHISKY SAFE</h1>
        <p class="subtitle">Deine private Sammlung</p>
    </header>

    <main>
        <!-- KENNZAHLEN -->
        <div class="grid">
            <div class="card">
                <div class="stat-label">GESAMTKAUFPREIS</div>
                <div id="total-purchase" class="stat-val">0,00 €</div>
            </div>
            <div class="card">
                <div class="stat-label">AKTUELLER WERT</div>
                <div id="total-current" class="stat-val" style="color: #f59e0b;">0,00 €</div>
                <div id="total-profit" style="font-size: 11px; margin-top: 4px; color: #4ade80;">+0,00 €</div>
            </div>
        </div>

        <!-- CAMERA FOTO -->
        <div class="card">
            <div class="stat-label" style="margin-bottom: 5px;">FLASCHEN-FOTO AUFNEHMEN</div>
            <div class="file-input-wrapper">
                <button class="btn btn-scan" id="photo-status-btn">📷 Foto mit iPhone aufnehmen</button>
                <input type="file" accept="image/*" capture="environment" id="whisky-photo-file">
            </div>
            <div id="photo-preview-text" style="font-size: 11px; color: #4ade80; text-align: center; margin-top: 5px; display: none;">✓ Foto temporär erfasst</div>
        </div>

        <!-- FORMULAR -->
        <div class="card">
            <div class="stat-label" style="margin-bottom: 10px;">NEUE FLASCHE DETAILS</div>
            <form id="whisky-form">
                <div class="form-group">
                    <label>Name der Flasche</label>
                    <input type="text" id="name" required placeholder="z.B. Lagavulin 16 Jahre">
                </div>
                <div class="form-group">
                    <label>Barcode / EAN (Optional manuell)</label>
                    <input type="text" id="barcode" placeholder="z.B. 5000281005231">
                </div>
                <div class="grid">
                    <div class="form-group">
                        <label>Kaufpreis (€)</label>
                        <input type="number" id="purchase_price" step="0.01" required placeholder="85.00">
                    </div>
                    <div class="form-group">
                        <label>Zeitwert (€)</label>
                        <input type="number" id="current_price" step="0.01" required placeholder="120.00">
                    </div>
                </div>
                <button type="submit" class="btn">Flasche speichern</button>
            </form>
        </div>

        <!-- LISTE -->
        <div class="stat-label" style="margin: 15px 0 8px 5px;">DEINE FLASCHEN</div>
        <div id="whisky-list"></div>
    </main>

    <!-- ERFOLGS POPUP -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">✓ Erfolgreich!</div>
            <p style="font-size: 14px; margin-bottom: 15px; color: #e5e7eb;">Flasche wurde erfolgreich zu deiner Sammlung hinzugefügt.</p>
            <button class="btn" onclick="closePopup()" style="margin: 0; background-color: #4ade80; color: #0d0e12;">OK</button>
        </div>
    </div>

    <script>
        // Absolut krisensichere Datenstruktur ohne externe Störfaktoren
        let whiskies = [];
        
        function loadData() {
            try {
                whiskies = JSON.parse(localStorage.getItem('whisky_safe_storage')) || [];
            } catch(e) {
                whiskies = [];
            }
        }

        function saveData() {
            try {
                localStorage.setItem('whisky_safe_storage', JSON.stringify(whiskies));
            } catch(e) {
                alert("Speichern auf diesem Gerät blockiert. Bitte nicht im privaten Modus nutzen.");
            }
        }

        const form = document.getElementById('whisky-form');
        const listContainer = document.getElementById('whisky-list');

        function initApp() {
            loadData();
            updateDashboard();
            renderList();
        }

        // Bild-Erfassung via iPhone Kamera
        document.getElementById('whisky-photo-file').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                document.getElementById('photo-preview-text').style.display = 'block';
                document.getElementById('photo-status-btn').style.backgroundColor = "#10b981";
                document.getElementById('photo-status-btn').innerText = "📷 Foto gespeichert";
            }
        });

        function updateDashboard() {
            let pSum = 0; let cSum = 0;
            whiskies.forEach(w => { 
                pSum += parseFloat(w.purchase_price || 0); 
                cSum += parseFloat(w.current_price || 0); 
            });
            document.getElementById('total-purchase').innerText = pSum.toFixed(2) + " €";
            document.getElementById('total-current').innerText = cSum.toFixed(2) + " €";
            const diff = cSum - pSum;
            const pEl = document.getElementById('total-profit');
            pEl.innerText = (diff >= 0 ? "+" : "") + diff.toFixed(2) + " € Differenz";
            pEl.style.color = diff >= 0 ? "#4ade80" : "#f87171";
        }

        function renderList() {
            listContainer.innerHTML = '';
            if (!whiskies || whiskies.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center;color:#6b7280;font-size:14px;padding:20px;">Keine Flaschen eingetragen.</div>';
                return;
            }
            whiskies.forEach((w, i) => {
                const div = document.createElement('div');
                div.className = 'whisky-item';
                const diff = parseFloat(w.current_price || 0) - parseFloat(w.purchase_price || 0);
                div.innerHTML = `
                    <div>
                        <div class="item-name">${w.name}</div>
