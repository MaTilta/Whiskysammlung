<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Whisky Safe</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- QuaggaJS für die echte Barcode-Erkennung aus Fotos -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d0e12;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding-bottom: 40px;
        }
        header {
            background-color: #161922;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 1px solid #1f2937;
        }
        h1 { color: #f59e0b; font-size: 24px; letter-spacing: 1px; }
        p.subtitle { color: #9ca3af; font-size: 12px; margin-top: 5px; }
        main { max-width: 450px; margin: 0 auto; padding: 15px; }
        
        .card {
            background-color: #161922;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .grid { display: grid; grid-template-cols: 1fr 1fr; gap: 10px; }
        .stat-label { color: #9ca3af; font-size: 11px; text-transform: uppercase; }
        .stat-val { font-size: 18px; font-weight: bold; margin-top: 5px; }
        
        .btn {
            width: 100%;
            background-color: #f59e0b;
            color: #0d0e12;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        .btn-scan { background-color: #3f3f46; color: white; text-align: center; line-height: 1.5; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; color: #9ca3af; font-size: 11px; margin-bottom: 4px; }
        input {
            width: 100%;
            background-color: #1e2330;
            border: 1px solid #374151;
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
        }
        
        .whisky-item {
            background-color: #161922;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-name { font-weight: bold; font-size: 14px; color: #f3f4f6; }
        .item-meta { color: #9ca3af; font-size: 12px; margin-top: 2px; }
        .item-val { color: #f59e0b; font-weight: bold; font-size: 14px; text-align: right; }
        .btn-delete { background: none; color: #6b7280; border: none; font-size: 16px; cursor: pointer; padding: 5px; }

        /* Custom Popup Style */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background-color: #161922;
            border: 1px solid #374151;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            max-width: 300px;
            width: 90%;
        }
        .modal-title { color: #4ade80; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>WHISKY SAFE</h1>
        <p class="subtitle">Deine private Sammlung</p>
    </header>

    <main>
        <!-- KENNZAHLEN -->
        <div class="grid">
            <div class="card">
                <div class="stat-label">GESAMTKAUFPREIS</div>
                <div id="total-purchase" class="stat-val">0,00 €</div>
            </div>
            <div class="card">
                <div class="stat-label">AKTUELLER WERT</div>
                <div id="total-current" class="stat-val" style="color: #f59e0b;">0,00 €</div>
                <div id="total-profit" style="font-size: 11px; margin-top: 4px; color: #4ade80;">+0,00 €</div>
            </div>
        </div>

        <!-- SCANNER -->
        <div class="card">
            <div class="stat-label" style="margin-bottom: 5px;">BARCODE FOTOGRAFIEREN</div>
            <div class="file-input-wrapper">
                <button class="btn btn-scan" id="scan-status-btn">📷 Foto aufnehmen / Scannen</button>
                <input type="file" accept="image/*" capture="environment" id="barcode-file">
            </div>
            <p style="font-size: 10px; color: #9ca3af; text-align: center; margin-top: 5px;">Möglichst scharf und nah herangehen</p>
        </div>

        <!-- FORMULAR -->
        <div class="card">
            <div class="stat-label" style="margin-bottom: 10px;">NEUE FLASCHE DETAILS</div>
            <form id="whisky-form">
                <div class="form-group">
                    <label>Name der Flasche</label>
                    <input type="text" id="name" required placeholder="z.B. Lagavulin 16 Jahre">
                </div>
                <div class="form-group">
                    <label>Gescannter Code (EAN)</label>
                    <input type="text" id="barcode" placeholder="Erscheint nach dem Foto" readonly style="color: #9ca3af;">
                </div>
                <div class="grid">
                    <div class="form-group">
                        <label>Kaufpreis (€)</label>
                        <input type="number" id="purchase_price" step="0.01" required placeholder="85.00">
                    </div>
                    <div class="form-group">
                        <label>Zeitwert (€)</label>
                        <input type="number" id="current_price" step="0.01" required placeholder="120.00">
                    </div>
                </div>
                <button type="submit" class="btn">Flasche speichern</button>
            </form>
        </div>

        <!-- LISTE -->
        <div class="stat-label" style="margin: 15px 0 8px 5px;">DEINE FLASCHEN</div>
        <div id="whisky-list"></div>
    </main>

    <!-- ERFOLGS POPUP -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">✓ Erfolgreich!</div>
            <p style="font-size: 14px; margin-bottom: 15px;">Flasche zur Sammlung hinzugefügt.</p>
            <button class="btn" onclick="closePopup()" style="margin: 0;">OK</button>
        </div>
    </div>

    <script>
        // Absolut krisensichere Speicher-Methode (nutzt Fallbacks)
        let whiskies = [];
        function loadData() {
            try {
                whiskies = JSON.parse(localStorage.getItem('w_safe_data')) || [];
            } catch(e) {
                if(window.name) { try { whiskies = JSON.parse(window.name); } catch(err){} }
            }
        }
        function saveData() {
            try {
                localStorage.setItem('w_safe_data', JSON.stringify(whiskies));
            } catch(e) {}
            try { window.name = JSON.stringify(whiskies); } catch(err){}
        }

        const form = document.getElementById('whisky-form');
        const listContainer = document.getElementById('whisky-list');

        function initApp() {
            loadData();
            updateDashboard();
            renderList();
        }

        // ECHTE Barcode-Erkennung aus dem geschossenen Foto
        document.getElementById('barcode-file').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const file = e.target.files[0];
                const reader = new FileReader();
                const btn = document.getElementById('scan-status-btn');
                
                btn.innerText = "⏳ Code wird analysiert...";
                btn.style.backgroundColor = "#6b7280";

                reader.onload = function(event) {
                    Quagga.decodeSingle({
                        decoder: {
                            readers: ["ean_reader", "ean_8_reader", "code_128_reader", "code_39_reader"] 
                        },
                        locate: true,
                        src: event.target.result
                    }, function(result) {
                        if(result && result.codeResult) {
                            document.getElementById('barcode').value = result.codeResult.code;
                            btn.innerText = "✓ Code erkannt!";
                            btn.style.backgroundColor = "#10b981";
                            
                            // Nächster Meilenstein vorbereitet: Suche im Web nach EAN Code!
                            document.getElementById('name').value = "Whisky wird gesucht (EAN: " + result.codeResult.code + ")";
                        } else {
                            btn.innerText = "⚠️ Nicht erkannt. Erneut versuchen.";
                            btn.style.backgroundColor = "#ef4444";
                            alert("Barcode im Foto nicht gefunden. Bitte halte die Kamera näher und ruhiger auf den Strichcode.");
                        }
                        setTimeout(() => {
                            btn.innerText = "📷 Foto aufnehmen / Scannen";
