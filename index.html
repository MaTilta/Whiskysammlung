<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Whisky Safe</title>
    <!-- Apple PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Whisky Safe">
    
    <!-- Tailwind CSS v4, Chart.js & Barcode Scanner Bibliothek -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://unpkg.com"></script>
    
    <style>
        :root, html, body {
            background-color: #0d0e12 !important;
            color: #f3f4f6 !important;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        input { color: #f3f4f6 !important; }
        /* Versteckt hässliche Standard-Buttons der Scanner-Bibliothek */
        #reader button {
            background-color: #f59e0b !important;
            color: #0d0e12 !important;
            font-weight: bold !important;
            padding: 8px 16px !important;
            border-radius: 12px !important;
            border: none !important;
            margin-top: 10px !important;
            cursor: pointer;
        }
    </style>
</head>
<body class="pb-10 bg-[#0d0e12]">

    <!-- Header -->
    <header class="bg-[#161922] pt-12 pb-6 px-4 rounded-b-3xl shadow-lg border-b border-gray-800 sticky top-0 z-50">
        <h1 class="text-2xl font-bold text-amber-500 text-center tracking-wide">WHISKY SAFE</h1>
        <p class="text-xs text-gray-400 text-center mt-1">Deine private Sammlung</p>
    </header>

    <main class="max-w-md mx-auto px-4 mt-6 space-y-6">

        <!-- KENNZAHLEN -->
        <section class="grid grid-cols-2 gap-4">
            <div class="bg-[#161922] p-4 rounded-2xl border border-gray-800 shadow-md">
                <span class="text-xs text-gray-400 uppercase tracking-wider">Gesamtkaufpreis</span>
                <div id="total-purchase" class="text-xl font-bold text-gray-200 mt-1">0,00 €</div>
            </div>
            <div class="bg-[#161922] p-4 rounded-2xl border border-gray-800 shadow-md">
                <span class="text-xs text-gray-400 uppercase tracking-wider">Aktueller Wert</span>
                <div id="total-current" class="text-xl font-bold text-amber-500 mt-1">0,00 €</div>
                <div id="total-profit" class="text-xs font-semibold mt-1 text-green-400">+0,00 €</div>
            </div>
        </section>

        <!-- DIAGRAMM -->
        <section class="bg-[#161922] p-4 rounded-2xl border border-gray-800 shadow-md">
            <h2 class="text-sm font-semibold text-gray-300 mb-3 tracking-wide">Wertentwicklung im Vergleich</h2>
            <div class="h-48 w-full">
                <canvas id="valueChart"></canvas>
            </div>
        </section>

        <!-- BARCODE SCANNER BERICH -->
        <section class="bg-[#161922] p-4 rounded-2xl border border-gray-800 shadow-md space-y-3">
            <h2 class="text-sm font-semibold text-gray-300 tracking-wide">Flasche per Barcode erfassen</h2>
            <button onclick="toggleScanner()" id="scan-btn" class="w-full bg-zinc-700 hover:bg-zinc-600 text-white font-medium py-2 rounded-xl text-sm flex items-center justify-center gap-2 transition-colors">
                📷 Kamera-Scanner öffnen
            </button>
            <div id="scanner-container" class="hidden overflow-hidden rounded-xl border border-gray-700 bg-black">
                <div id="reader" class="w-full"></div>
            </div>
        </section>

        <!-- NEU ANLEGEN FORMULAR -->
        <section class="bg-[#161922] p-5 rounded-2xl border border-gray-800 shadow-md">
            <h2 class="text-sm font-semibold text-gray-300 mb-4 tracking-wide">Flaschen-Details</h2>
            <form id="whisky-form" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Name der Flasche</label>
                    <input type="text" id="name" required placeholder="z.B. Lagavulin 16 Jahre" class="w-full bg-[#1e2330] border border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-amber-500 transition-colors">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Gescannter Code (EAN / Barcode)</label>
                    <input type="text" id="barcode" placeholder="Wird beim Scannen automatisch ausgefüllt" class="w-full bg-[#1e2330]/50 border border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-400 focus:outline-none" readonly>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Kaufpreis (€)</label>
                        <input type="number" id="purchase_price" step="0.01" required placeholder="85.00" class="w-full bg-[#1e2330] border border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-amber-500 transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Aktueller Zeitwert (€)</label>
                        <input type="number" id="current_price" step="0.01" required placeholder="120.00" class="w-full bg-[#1e2330] border border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-amber-500 transition-colors">
                    </div>
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-[#0d0e12] font-bold py-2.5 rounded-xl text-sm shadow-md transition-all active:scale-[0.98]">
                    Flasche speichern
                </button>
            </form>
        </section>

        <!-- LISTE DER FLASCHEN -->
        <section class="space-y-3">
            <h2 class="text-sm font-semibold text-gray-300 tracking-wide px-1">Deine Flaschen</h2>
            <div id="whisky-list" class="space-y-3">
                <!-- Dynamische Inhalte -->
            </div>
        </section>

    </main>

    <script>
        let whiskies = JSON.parse(localStorage.getItem('whisky_collection')) || [];
        let myChart = null;
        let html5QrcodeScanner = null;

        const form = document.getElementById('whisky-form');
        const listContainer = document.getElementById('whisky-list');

        function initApp() {
            updateDashboard();
            renderList();
            renderChart();
        }

        // SCANNER LOGIK
        function toggleScanner() {
            const container = document.getElementById('scanner-container');
            const btn = document.getElementById('scan-btn');
            
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                btn.innerText = "✕ Scanner schließen";
                btn.classList.replace('bg-zinc-700', 'bg-red-900');
                
                // Scanner starten (nutzt die Rückkamera des iPhones)
                html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
                    fps: 10, 
                    qrbox: { width: 250, height: 150 },
                    rememberLastUsedCamera: true
                });
                
                html5QrcodeScanner.render(onScanSuccess, onScanFailure);
            } else {
                stopScanner();
            }
        }

        function stopScanner() {
            const container = document.getElementById('scanner-container');
            const btn = document.getElementById('scan-btn');
            container.classList.add('hidden');
            btn.innerText = "📷 Kamera-Scanner öffnen";
            btn.classList.replace('bg-red-900', 'bg-zinc-700');
            
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().catch(err => console.error(err));
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Vibrieren/Feedback simulieren und Code eintragen
            document.getElementById('barcode').value = decodedText;
            
            // Dem Benutzer zeigen, dass etwas passiert ist
            document.getElementById('barcode').classList.add('border-green-500');
            setTimeout(() => document.getElementById('barcode').classList.remove('border-green-500'), 1500);
            
            // Scanner nach Erfolg automatisch stoppen
            stopScanner();
            
            // Hier kommt im nächsten Schritt die Internet-Suche nach dem Namen hin!
            document.getElementById('name').value = "Code erkannt: Suche folgt..."; 
        }

        function onScanFailure(error) {
            // Ignorieren wir, da er jede Millisekunde sucht und Fehler wirft, wenn er gerade keinen Code sieht
        }

        // DASHBOARD & LISTE & CHART (Wie vorher)
        function updateDashboard() {
            let totalPurchase = 0; let totalCurrent = 0;
            whiskies.forEach(w => {
                totalPurchase += parseFloat(w.purchase_price || 0);
                totalCurrent += parseFloat(w.current_price || 0);
            });
            document.getElementById('total-purchase').innerText = totalPurchase.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
            document.getElementById('total-current').innerText = totalCurrent.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
            const profitEl = document.getElementById('total-profit');
            const diff = totalCurrent - totalPurchase;
