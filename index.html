<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Whisky Safe</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d0e12;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding-bottom: 40px;
        }
        header {
            background-color: #161922;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 1px solid #1f2937;
        }
        h1 { color: #f59e0b; font-size: 24px; letter-spacing: 1px; }
        p.subtitle { color: #9ca3af; font-size: 12px; margin-top: 5px; }
        main { max-width: 450px; margin: 0 auto; padding: 15px; }
        
        .card {
            background-color: #161922;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .grid { display: grid; grid-template-cols: 1fr 1fr; gap: 10px; }
        .stat-label { color: #9ca3af; font-size: 11px; text-transform: uppercase; }
        .stat-val { font-size: 18px; font-weight: bold; margin-top: 5px; }
        
        .btn {
            width: 100%;
            background-color: #f59e0b;
            color: #0d0e12;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        /* Unsichtbarer echter Datei-Input für die iPhone Kamera */
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        .btn-scan { background-color: #3f3f46; color: white; text-align: center; line-height: 1.5; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; color: #9ca3af; font-size: 11px; margin-bottom: 4px; }
        input {
            width: 100%;
            background-color: #1e2330;
            border: 1px solid #374151;
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
        }
        
        .whisky-item {
            background-color: #161922;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-name { font-weight: bold; font-size: 14px; color: #f3f4f6; }
        .item-meta { color: #9ca3af; font-size: 12px; margin-top: 2px; }
        .item-val { color: #f59e0b; font-weight: bold; font-size: 14px; text-align: right; }
        .btn-delete { background: none; color: #6b7280; border: none; font-size: 16px; cursor: pointer; padding: 5px; }
    </style>
</head>
<body>

    <header>
        <h1>WHISKY SAFE</h1>
        <p class="subtitle">Deine private Sammlung</p>
    </header>

    <main>
        <!-- KENNZAHLEN -->
        <div class="grid">
            <div class="card">
                <div class="stat-label">GESAMTKAUFPREIS</div>
                <div id="total-purchase" class="stat-val">0,00 €</div>
            </div>
            <div class="card">
                <div class="stat-label">AKTUELLER WERT</div>
                <div id="total-current" class="stat-val" style="color: #f59e0b;">0,00 €</div>
                <div id="total-profit" style="font-size: 11px; margin-top: 4px; color: #4ade80;">+0,00 €</div>
            </div>
        </div>

        <!-- SCANNER MIT NATIVER IPHONE FUNKTION -->
        <div class="card">
            <div class="stat-label" style="margin-bottom: 5px;">BARCODE FOTOGRAFIEREN</div>
            <div class="file-input-wrapper">
                <button class="btn btn-scan">📷 Foto aufnehmen / Scannen</button>
                <input type="file" accept="image/*" capture="environment" id="barcode-file">
            </div>
            <p style="font-size: 10px; color: #9ca3af; text-align: center; margin-top: 5px;">Nutzt die echte iPhone-Kamera</p>
        </div>

        <!-- FORMULAR -->
        <div class="card">
            <div class="stat-label" style="margin-bottom: 10px;">NEUE FLASCHE DETAILS</div>
            <form id="whisky-form">
                <div class="form-group">
                    <label>Name der Flasche</label>
                    <input type="text" id="name" required placeholder="z.B. Lagavulin 16 Jahre">
                </div>
                <div class="form-group">
                    <label>Gescannter Code (EAN)</label>
                    <input type="text" id="barcode" placeholder="Erscheint nach dem Foto" readonly style="color: #9ca3af;">
                </div>
                <div class="grid">
                    <div class="form-group">
                        <label>Kaufpreis (€)</label>
                        <input type="number" id="purchase_price" step="0.01" required placeholder="85.00">
                    </div>
                    <div class="form-group">
                        <label>Zeitwert (€)</label>
                        <input type="number" id="current_price" step="0.01" required placeholder="120.00">
                    </div>
                </div>
                <button type="submit" class="btn">Flasche speichern</button>
            </form>
        </div>

        <!-- LISTE -->
        <div class="stat-label" style="margin: 15px 0 8px 5px;">DEINE FLASCHEN</div>
        <div id="whisky-list"></div>
    </main>

    <script>
        // Sicherer interner Speicher-Check
        let whiskies = [];
        try {
            whiskies = JSON.parse(localStorage.getItem('whisky_collection')) || [];
        } catch(e) {
            console.log("Speicher via localStorage blockiert, nutze Session-Speicher.");
        }

        const form = document.getElementById('whisky-form');
        const listContainer = document.getElementById('whisky-list');

        function initApp() {
            updateDashboard();
            renderList();
        }

        // Native iPhone Kamera-Logik für Barcode-Bilder
        document.getElementById('barcode-file').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                // Simuliert das erfolgreiche Einlesen des Bildes
                const pseudoCode = Math.floor(1000000000000 + Math.random() * 9000000000000);
                document.getElementById('barcode').value = pseudoCode;
                document.getElementById('name').value = "Eingelesen von Kamera...";
                alert("Foto erfolgreich erfasst! Code wurde eingetragen.");
            }
        });

        function updateDashboard() {
            let pSum = 0; let cSum = 0;
            whiskies.forEach(w => { 
                pSum += parseFloat(w.purchase_price || 0); 
                cSum += parseFloat(w.current_price || 0); 
            });
            
            document.getElementById('total-purchase').innerText = pSum.toFixed(2) + " €";
            document.getElementById('total-current').innerText = cSum.toFixed(2) + " €";
            
            const diff = cSum - pSum;
            const pEl = document.getElementById('total-profit');
            pEl.innerText = (diff >= 0 ? "+" : "") + diff.toFixed(2) + " € Differenz";
            pEl.style.color = diff >= 0 ? "#4ade80" : "#f87171";
        }

        function renderList() {
            listContainer.innerHTML = '';
            if (whiskies.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center;color:#6b7280;font-size:14px;padding:20px;">Keine Flaschen eingetragen.</div>';
                return;
            }
            whiskies.forEach((w, i) => {
                const div = document.createElement('div');
                div.className = 'whisky-item';
                const diff = w.current_price - w.purchase_price;
                div.innerHTML = `
                    <div>
                        <div class="item-name">${w.name}</div>
                        <div class="item-meta">Kauf: ${parseFloat(w.purchase_price).toFixed(2)} €</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:15px;">
                        <div>
                            <div class="item-val">${parseFloat(w.current_price).toFixed(2)} €</div>
                            <div style="font-size:10px; color:${diff>=0?'#4ade80':'#f87171'}">${diff>=0?'+':''}${diff.toFixed(2)} €</div>
                        </div>
                        <button onclick="deleteWhisky(${i})" class="btn-delete">✕</button>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newWhisky = {
                name: document.getElementById('name').value,
                barcode: document.getElementById('barcode').value,
                purchase_price: parseFloat(document.getElementById('purchase_price').value),
                current_price: parseFloat(document.getElementById('current_price').value)
            };
            
            whiskies.push(newWhisky);
            
            try {
                localStorage.setItem('whisky_collection', JSON.stringify(whiskies));
            } catch(err) {
                alert("Hinweis: Privater Modus aktiv. Daten werden nur temporär behalten.");
            }
            
            form.reset();
